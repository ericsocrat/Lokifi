# Automatic PR Labeling Configuration
# Used by actions/labeler@v5 in label-pr.yml workflow
# Docs: https://github.com/actions/labeler#common-examples

# Application labels
frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/frontend/**"

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/backend/**"

mobile:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/mobile/**"

admin:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/admin/**"

# CI/CD changes
ci-cd:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

# Dependencies (package managers)
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "**/package-lock.json"
          - "**/requirements*.txt"
          - "**/pyproject.toml"
          - "renovate.json"

# Infrastructure & DevOps
infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - "infra/**"
          - "**/docker-compose*.yml"
          - "**/Dockerfile*"
          - "**/.env.example"

# Testing
testing:
  - changed-files:
      - any-glob-to-any-file:
          - "**/tests/**"
          - "**/*.test.{ts,tsx}"
          - "**/*.spec.{ts,tsx}"
          - "**/test_*.py"
          - "**/conftest.py"
          - "**/vitest.config.*"
          - "**/playwright.config.*"
          - "**/pytest.ini"

# Configuration files
configuration:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.config.{js,ts,mjs,cjs}"
          - "**/tsconfig*.json"
          - "**/.eslintrc*"
          - "**/.prettierrc*"
          - "**/tailwind.config.*"
          - "config/**"

# Security-related changes
security:
  - changed-files:
      - any-glob-to-any-file:
          - "**/security/**"
          - "**/*security*.yml"
          - "**/SECURITY.md"

# Hotfix (security patches, critical fixes)
hotfix:
  - changed-files:
      - any-glob-to-any-file:
          - "**/security/patches/**"
          - ".github/workflows/security.yml"

# Performance
performance:
  - changed-files:
      - any-glob-to-any-file:
          - "**/performance/**"

# Database & Models
database:
  - changed-files:
      - any-glob-to-any-file:
          - "**/alembic/**"
          - "**/migrations/**"
          - "**/models/**"
          - "**/schemas/**"

# API routes
api:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/backend/app/api/**"
          - "apps/backend/app/routers/**"
          - "docs/api/**"

# UI Components
ui:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/frontend/src/components/**"
          - "apps/frontend/src/app/**"
          - "**/*.css"
          - "**/*.scss"

# E2E tests (triggers full browser suite)
e2e-full:
  - changed-files:
      - any-glob-to-any-file:
          - "**/tests/e2e/**"
          - "**/playwright.config.*"

# Visual regression tests
visual-regression:
  - changed-files:
      - any-glob-to-any-file:
          - "**/tests/visual/**"
          - "apps/frontend/src/components/**"
          - "apps/frontend/src/app/**/*.tsx"
