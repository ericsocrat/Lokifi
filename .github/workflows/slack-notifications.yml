# Slack Workflow Failure Notifications
# Sends real-time Slack notifications when critical workflows fail on main branch
# Provides team-wide awareness and faster incident response
#
# Setup Instructions:
# 1. Create Slack Incoming Webhook: https://api.slack.com/messaging/webhooks
# 2. Add webhook URL to GitHub Secrets as SLACK_WEBHOOK_URL
# 3. Test by triggering a workflow failure on main branch

name: 📢 Slack Notifications

on:
  workflow_run:
    workflows:
      - "⚡ Fast Feedback (CI)"
      - "📈 Coverage Tracking"
      - "🔗 Integration Tests"
      - "🎭 E2E Tests"
      - "🔐 Security Scanning"
    types:
      - completed
    branches:
      - main

permissions:
  actions: read

jobs:
  notify-slack:
    name: Send Slack Notification
    runs-on: ubuntu-latest

    # Only run if workflow failed (webhook check happens in step)
    if: github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: 🔍 Get workflow details
        id: details
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRun = context.payload.workflow_run;

            // Get failed jobs
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: workflowRun.id
            });

            const failedJobs = jobs.jobs.filter(job => job.conclusion === 'failure');
            const failedJobNames = failedJobs.map(job => job.name).join(', ');

            // Get commit details
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: workflowRun.head_sha
            });

            // Determine severity emoji
            let severityEmoji = '🔴';
            let severityText = 'High';

            if (workflowRun.name.includes('Security')) {
              severityEmoji = '🚨';
              severityText = 'Critical';
            } else if (workflowRun.name.includes('E2E')) {
              severityEmoji = '🟠';
              severityText = 'Medium';
            }

            core.setOutput('workflow-name', workflowRun.name);
            core.setOutput('workflow-url', workflowRun.html_url);
            core.setOutput('commit-sha', workflowRun.head_sha.substring(0, 7));
            core.setOutput('commit-message', commit.commit.message.split('\n')[0]);
            core.setOutput('commit-author', commit.commit.author.name);
            core.setOutput('commit-url', commit.html_url);
            core.setOutput('failed-jobs', failedJobNames || 'Unknown');
            core.setOutput('run-number', workflowRun.run_number);
            core.setOutput('severity-emoji', severityEmoji);
            core.setOutput('severity-text', severityText);
            core.setOutput('repo-url', `https://github.com/${context.repo.owner}/${context.repo.repo}`);

      - name: 📢 Send Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.details.outputs.severity-emoji }} Workflow Failure on Main",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n<${{ steps.details.outputs.workflow-url }}|${{ steps.details.outputs.workflow-name }} #${{ steps.details.outputs.run-number }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Severity:*\n${{ steps.details.outputs.severity-emoji }} ${{ steps.details.outputs.severity-text }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ steps.details.outputs.commit-url }}|${{ steps.details.outputs.commit-sha }}> by ${{ steps.details.outputs.commit-author }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n`main`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit Message:*\n```${{ steps.details.outputs.commit-message }}```"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Failed Jobs:*\n${{ steps.details.outputs.failed-jobs }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "🔗 <${{ steps.details.outputs.repo-url }}|View Repository> | <${{ steps.details.outputs.workflow-url }}|View Logs> | <${{ steps.details.outputs.repo-url }}/actions|All Workflows>"
                    }
                  ]
                }
              ],
              "attachments": [
                {
                  "color": "${{ steps.details.outputs.severity-text == 'Critical' && 'danger' || steps.details.outputs.severity-text == 'High' && 'warning' || '#808080' }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "⚡ *Action Required:* Review logs and fix ASAP to unblock main branch"
                      }
                    }
                  ]
                }
              ]
            }

      - name: 📊 Generate summary
        if: always()
        run: |
          echo "## 📢 Slack Notification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow**: ${{ steps.details.outputs.workflow-name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          echo "**Severity**: ${{ steps.details.outputs.severity-emoji }} ${{ steps.details.outputs.severity-text }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: [${{ steps.details.outputs.commit-sha }}](${{ steps.details.outputs.commit-url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]]; then
            echo "**Action**: ✅ Slack notification sent successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Action**: ⚠️ Slack webhook not configured (set SLACK_WEBHOOK_URL secret)" >> $GITHUB_STEP_SUMMARY
          fi
