name: 🏷️ Auto-Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 🏷️ Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - name: 🏷️ Apply labels
        id: labeler
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

      # Note: Size labeling is handled by pr-size-check.yml which has better features:
      # - Excludes generated files (package-lock.json, coverage/, dist/, etc.)
      # - Provides detailed metrics and recommendations for large PRs
      # - Uses consistent labels: size/XS, size/S, size/M, size/L, size/XL

      - name: 📝 Welcome comment
        if: github.event.action == 'opened'
        uses: actions/github-script@v8
        with:
          script: |
            // Fetch fresh labels after labeler action
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const labels = pr.labels.map(l => l.name);
            if (labels.length === 0) return;

            // Skip if welcome comment exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 10
            });
            if (comments.some(c => c.user?.type === 'Bot' && c.body?.includes('Auto-applied labels'))) return;

            const labelList = labels.map(l => '\u0060' + l + '\u0060').join(', ');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '👋 Thanks for your contribution!',
                '',
                '🏷️ **Auto-applied labels**: ' + labelList,
                '',
                'Labels determine which CI workflows run. They update automatically with new commits.'
              ].join('\n')
            });

      - name: 📊 Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🏷️ PR Labels

          | Category | Labels | Source |
          |----------|--------|--------|
          | **Application** | `frontend`, `backend`, `mobile`, `admin` | This workflow |
          | **Size** | `size/XS`, `size/S`, `size/M`, `size/L`, `size/XL` | pr-size-check.yml |
          | **Type** | `ci-cd`, `documentation`, `dependencies`, `testing`, `security` | This workflow |
          | **Scope** | `infrastructure`, `database`, `api`, `ui`, `configuration` | This workflow |

          Application, type, and scope labels auto-applied based on changed files.
          Size labels applied by pr-size-check.yml (excludes generated files).
          EOF
