name: 🏷️ Auto-Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 🏷️ Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - name: 🏷️ Apply labels
        id: labeler
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

      - name: � Size label
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/XS"
          xs_max_size: 10
          s_label: "size/S"
          s_max_size: 100
          m_label: "size/M"
          m_max_size: 500
          l_label: "size/L"
          l_max_size: 1000
          xl_label: "size/XL"
          message_if_xl: |
            ⚠️ This PR is quite large. Consider splitting it into smaller, focused PRs for easier review.

      - name: �📝 Welcome comment
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch fresh labels after labeler action
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const labels = pr.labels.map(l => l.name);
            if (labels.length === 0) return;

            // Skip if welcome comment exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 10
            });
            if (comments.some(c => c.user?.type === 'Bot' && c.body?.includes('Auto-applied labels'))) return;

            const labelList = labels.map(l => '\u0060' + l + '\u0060').join(', ');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '👋 Thanks for your contribution!',
                '',
                '🏷️ **Auto-applied labels**: ' + labelList,
                '',
                'Labels determine which CI workflows run. They update automatically with new commits.'
              ].join('\n')
            });

      - name: 📊 Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🏷️ PR Labels

          | Category | Labels |
          |----------|--------|
          | **Application** | `frontend`, `backend`, `mobile`, `admin` |
          | **Size** | `size/XS` (<10), `size/S` (<100), `size/M` (<500), `size/L` (<1000), `size/XL` (1000+) |
          | **Type** | `ci-cd`, `documentation`, `dependencies`, `testing`, `security` |
          | **Scope** | `infrastructure`, `database`, `api`, `ui`, `configuration` |

          Labels auto-applied based on changed files and PR size.
          EOF
