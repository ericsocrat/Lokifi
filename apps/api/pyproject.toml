[project]
name = "lokifi-api"
version = "2.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.128.1,<1", "uvicorn>=0.40,<1", "sqlalchemy>=2.0.46,<2.1",
  "psycopg[binary]>=3.3,<4", "alembic>=1.18,<2", "argon2-cffi>=25.1,<27",
  "pydantic-settings>=2.12,<3", "email-validator>=2.3,<3", "httpx>=0.28,<1", "tiktoken>=0.12,<1"
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.16,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
