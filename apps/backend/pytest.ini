[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    config_validation: marks tests that validate config (skip in CI where env vars are set)
addopts =
    --tb=short
    --cov=app
    --cov-branch
    --cov-report=html:htmlcov
    --cov-report=json
    --cov-report=xml:coverage.xml
    --cov-fail-under=20
    --strict-markers
filterwarnings =
    # Suppress known AsyncMock coroutine warnings in tests (false positives when mocks aren't fully consumed)
    ignore:coroutine.*was never awaited:RuntimeWarning
    # Suppress FastAPI on_event deprecation (lifespan migration planned for Phase P)
    # These warnings come from app.routers.websocket and app.api.routes.alerts modules
    ignore::DeprecationWarning:app.routers.websocket
    ignore::DeprecationWarning:app.api.routes.alerts
    # Suppress openapi_spec_validator deprecation (external library)
    ignore::DeprecationWarning:openapi_spec_validator.*
    # Suppress openapi_core Spec deprecation (external library)
    ignore::DeprecationWarning:openapi_core.*
    # Suppress starlette HTTP_413_REQUEST_ENTITY_TOO_LARGE deprecation (internal starlette handling)
    ignore:'HTTP_413_REQUEST_ENTITY_TOO_LARGE' is deprecated:DeprecationWarning

[coverage:run]
source = app
branch = True
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @overload
    pass
    \.\.\.
    raise NotImplemented
