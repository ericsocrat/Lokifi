[mypy]
# Python version (aligned with venv: Python 3.13.9)
python_version = 3.13

# Exclude virtual environment and third-party code
# This pattern excludes venv, .venv, __pycache__, and alembic migration files
exclude = (venv|\.venv|__pycache__|alembic/versions)/

# Plugins for better type checking
# NOTE: MyPy INI format requires comma-separated plugins, NOT Python list syntax
plugins = pydantic.mypy, sqlalchemy.ext.mypy.plugin

# ============================================================================
# KNOWN ISSUES - SQLAlchemy Plugin Limitation
# ============================================================================
# The sqlalchemy.ext.mypy.plugin does not recognize column names as valid
# keyword arguments in ORM model constructors. This results in "call-arg"
# errors like:
#   error: Unexpected keyword argument "user_id" for "User"
#
# These are FALSE POSITIVES - the code works correctly at runtime.
# As of Session 127, there are 87 such errors across 5 files:
#   - auth_service.py (27)
#   - profile_enhanced.py (24)
#   - notification_service.py (15)
#   - conversation_service.py (13)
#   - follow_service.py (8)
#
# These errors cannot be fixed without:
#   1. Adding per-line `# type: ignore[call-arg]` comments (adds noise)
#   2. Waiting for upstream SQLAlchemy plugin improvements
#   3. Using a different plugin or type stubs
#
# For now, we accept these errors as known limitations.
# ============================================================================

# Pragmatic type checking - Quality-focused but realistic
# This configuration enables critical type safety while allowing incremental improvement
# Goal: Catch real bugs without requiring perfection on day 1

# Import discovery
namespace_packages = True
explicit_package_bases = True

# Platform configuration
platform = linux

# Disallow dynamic typing (pragmatic settings)
# Too strict for gradual typing adoption
disallow_any_unimported = False
disallow_any_expr = False
disallow_any_decorated = False
disallow_any_explicit = False
disallow_any_generics = False
disallow_subclassing_any = False

# Disallow untyped definitions and calls (pragmatic settings)
# Allow calling untyped functions during transition period
disallow_untyped_calls = False
# Don't require all functions to have types yet
disallow_untyped_defs = False
# Allow partial type annotations
disallow_incomplete_defs = False
# But check the body of untyped functions for logic errors
check_untyped_defs = True
disallow_untyped_decorators = False

# None and Optional handling (strict - catches real bugs)
no_implicit_optional = True
strict_optional = True

# Configuring warnings (strict - these catch real issues)
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
# Pragmatic: Allow Any returns temporarily during transition
warn_return_any = False
warn_unreachable = True

# Strictness flags
strict_equality = True

# Configuring error messages
show_error_context = True
show_column_numbers = True
show_error_codes = True
pretty = True
color_output = True
error_summary = True

# Incremental mode
incremental = True
cache_dir = .mypy_cache

# Advanced options
warn_unused_configs = True
allow_redefinition = False
local_partial_types = False

# Suppressing errors (pragmatic)
ignore_missing_imports = False
# Pragmatic: Allow calling untyped code during transition
allow_untyped_calls = True
# Pragmatic: Allow untyped function definitions
allow_untyped_defs = True

# Per-module options
[mypy-tests.*]
disallow_untyped_defs = False
# Still check tests for logic errors
ignore_errors = False

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-celery]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

# Celery tasks - ignore untyped imports since celery has no stubs
[mypy-app.tasks.*]
ignore_missing_imports = True
disallow_untyped_defs = False

[mypy-redis.*]
ignore_missing_imports = True

[mypy-redis.asyncio]
ignore_missing_imports = True

# Third-party libraries without stubs
[mypy-schemathesis.*]
ignore_missing_imports = True

[mypy-websockets.*]
ignore_missing_imports = True

[mypy-jmespath.*]
ignore_missing_imports = True

# Pragmatic per-module settings for complex modules
# These modules have many type issues but are less critical for type safety
# We'll incrementally improve these over time

[mypy-app.testing.performance.*]
# Performance testing utilities - less critical for production type safety
warn_return_any = False
allow_untyped_defs = True

[mypy-app.optimization.*]
# Optimization modules - complex algorithms, allow more flexibility
warn_return_any = False

[mypy-app.analytics.*]
# Analytics modules - data processing heavy, allow flexibility
warn_return_any = False

[mypy-app.models.notification_models]
# Complex notification models - allow flexibility in model definitions
warn_return_any = False

[mypy-app.services.notification_service]
# Notification service - complex business logic
warn_return_any = False

[mypy-app.services.notification_analytics]
# Notification analytics - data heavy
warn_return_any = False

[mypy-app.services.smart_notifications]
# Smart notifications - ML/AI features
warn_return_any = False
